<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YieldPredict | AI-Powered Agriculture</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-background"></div>
    
    <main class="container">
        <header>
            <div class="logo">🌾 Yield<span>Predict</span></div>
            <h1>Smart Crop Prediction</h1>
            <p>Leverage machine learning to optimize your agricultural output.</p>
        </header>

        <section class="prediction-card">
            <form id="prediction-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="Year">Year</label>
                        <input type="number" id="Year" name="Year" value="2024" required>
                    </div>
                    <div class="input-group">
                        <label for="average_rain_fall_mm_per_year">Rainfall (mm/year)</label>
                        <input type="number" step="0.01" id="average_rain_fall_mm_per_year" name="average_rain_fall_mm_per_year" placeholder="e.g. 1200" required>
                    </div>
                    <div class="input-group">
                        <label for="pesticides_tonnes">Pesticides (tonnes)</label>
                        <input type="number" step="0.01" id="pesticides_tonnes" name="pesticides_tonnes" placeholder="e.g. 50" required>
                    </div>
                    <div class="input-group">
                        <label for="avg_temp">Avg Temperature (°C)</label>
                        <input type="number" step="0.01" id="avg_temp" name="avg_temp" placeholder="e.g. 25" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="Item">Select Crop</label>
                        <select id="Item" name="Item" required>
                            <option value="Maize">Maize</option>
                            <option value="Potatoes">Potatoes</option>
                            <option value="Rice, paddy">Rice</option>
                            <option value="Wheat">Wheat</option>
                            <option value="Sorghum">Sorghum</option>
                            <option value="Soybeans">Soybeans</option>
                            <option value="Sweet potatoes">Sweet potatoes</option>
                            <option value="Yams">Yams</option>
                            <option value="Plantains and others">Plantains</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submit-btn">Predict Yield 🚀</button>
            </form>

            <div id="result-container" class="hidden">
                <div class="divider"></div>
                <h2>Predicted Yield</h2>
                <div class="yield-value"><span id="prediction-text">--</span> <small>hg/ha</small></div>
                <p class="prediction-note">Based on your environmental parameters.</p>
            </div>
            
            <div id="loader" class="hidden">
                <div class="spinner"></div>
            </div>
        </section>

        <footer>
            <p>&copy; 2024 YieldPredict AI. Empowering sustainable farming.</p>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
